services:
  redis:
    image: redis:7-alpine
    container_name: cscanner-redis
    restart: unless-stopped
    ports:
      # Published for local `pnpm dev` / `pnpm dev:worker` (REDIS_URL=redis://127.0.0.1:6379)
      - "6379:6379"
    volumes:
      - redis-data:/data

  web:
    # Built from this Git repo by Portainer (not pulled from Docker Hub).
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: cscanner
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      # Host 3003 — free on this host (3000–3002 already in use).
      - "3003:3000"
    environment:
      STEAM_API_KEY: ${STEAM_API_KEY}
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      LEETIFY_API_KEY: ${LEETIFY_API_KEY:-}
      CSREP_API_KEY: ${CSREP_API_KEY:-}
      CSREP_API_KEY_ID: ${CSREP_API_KEY_ID:-}
      CSREP_API_BASE: ${CSREP_API_BASE:-}
      CSAPI_API_KEY: ${CSAPI_API_KEY:-}
      CSAPI_BASE: ${CSAPI_BASE:-}
      API_PROXY_URL: ${API_PROXY_URL:-}
      API_PROXY_TOKEN: ${API_PROXY_TOKEN:-}
      # Share-code GC fetch runs in the web process (direct analyze route).
      STEAM_GC_ENABLED: ${STEAM_GC_ENABLED:-}
      STEAM_REFRESH_TOKEN: ${STEAM_REFRESH_TOKEN:-}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      ANALYZE_WORKER_PATH: /app/analyze-worker.cjs
    volumes:
      - demo-data:/data
    # Web stays light — demoparser runs on the worker.

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: cscanner-worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      ANALYZE_CONCURRENCY: ${ANALYZE_CONCURRENCY:-1}
      ANALYZE_WORKER_PATH: /app/analyze-worker.cjs
      # Steam GC bot for match share-code → demo download (never put on web).
      STEAM_REFRESH_TOKEN: ${STEAM_REFRESH_TOKEN:-}
      # Demoparser + large demos need headroom; OOM kills show up as failed jobs.
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - demo-data:/data
    command: ["node", "analyze-worker.cjs"]

volumes:
  demo-data:
  redis-data:
