services:
  cscanner:
    # Built from this Git repo by Portainer (not pulled from Docker Hub).
    build:
      context: .
      dockerfile: Dockerfile
    # Force rebuild from Dockerfile on deploy/update — required for Portainer Git stacks.
    # Do NOT use Portainer "Re-pull image" — there is no Hub image named cscanner.
    pull_policy: build
    container_name: cscanner
    restart: unless-stopped
    ports:
      # Host 3003 — free on this host (3000–3002 already in use).
      - "3003:3000"
    environment:
      STEAM_API_KEY: ${STEAM_API_KEY}
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      LEETIFY_API_KEY: ${LEETIFY_API_KEY:-}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
